document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rmal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ccdecc37-7863-4712-9b27-cf692e7074f5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"0366d054-0857-4ed6-8150-26a593370adc\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"b1b8fb31-596b-4b54-a6c5-cbbdc3e94ef3\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"a7f5730a-3ead-4609-b105-1e79dc8eb528\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"f6feab70-61c1-4c27-96db-95805efdd403\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"34cafd41-61a6-49e8-875d-8b45bbb67316\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"c90c016c-30f4-45d1-8f72-e3773224218b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"ccdecc37-7863-4712-9b27-cf692e7074f5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n@font-face {\n  font-family: 'VictoryStriker';\n  src: url(\"c8d7f5f8-0660-4e20-9d5c-f25be9467188\") format('opentype');\n  font-weight: normal;\n  font-style: normal;\n  font-display: block;\n}\n<\u002Fstyle>\n  <style>/* ════════════════════════════════════════════════════════════════════\n   ATHLIX — COLOUR SYSTEM\n   Source of truth: src/theme/colors.ts (applied at runtime in the app).\n   Lime-on-blue-black. Dark scheme only.\n   ════════════════════════════════════════════════════════════════════ */\n\n:root {\n  color-scheme: dark;\n\n  /* ── Backgrounds — darkest (root) → lightest (raised) ──────────── */\n  --bg-base:        #0a0c10;   /* app / page background          */\n  --bg-surface:     #121720;   /* cards, sheets, panels          */\n  --bg-elevated:    #1a2030;   /* inputs, inner cards, rows      */\n  --bg-hover:       #1e2638;   /* hover / tapped state           */\n\n  /* ── Borders ───────────────────────────────────────────────────── */\n  --border:         #1e2638;   /* default 1px border             */\n  --border-subtle:  #121720;   /* hairline dividers inside cards */\n\n  /* ── Text ──────────────────────────────────────────────────────── */\n  --text-primary:   #e8edf3;   /* headings, numbers              */\n  --text-secondary: #8692a4;   /* subheads, meta labels          */\n  --text-muted:     #3a4a60;   /* placeholders, disabled, quiet  */\n\n  /* ── Accent — lime. Change one value to re-brand. ──────────────── */\n  --accent:         #C8FF00;\n  --accent-hover:   #b0e000;\n  --accent-dim:     rgba(200, 255, 0, 0.12);   /* tinted fills behind accent */\n  --accent-glow:    rgba(200, 255, 0, 0.30);   /* FAB / ring glow            */\n  --on-accent:      #000000;                   /* text on lime               */\n\n  /* ── Metric rings (Home & Progress hero) ───────────────────────── */\n  --ring-volume:    #4FC3F7;   /* blue   */\n  --ring-recovery:  #FFD54F;   /* yellow */\n  --ring-strain:    #C8FF00;   /* lime   */\n\n  /* ── Muscle groups — workout cards, calendar bars, muscle map ──── */\n  --chest:      #F09595;   /* pink-red    */\n  --back:       #5DCAA5;   /* sage green  */\n  --legs:       #EF9F27;   /* orange      */\n  --shoulders:  #AFA9EC;   /* lavender    */\n  --core:       #ff7a59;   /* coral       */\n  --biceps:     #85B7EB;   /* steel blue  */\n  --triceps:    #AFA9EC;   /* lavender    */\n  --cardio:     #ff7a59;   /* coral       */\n  --glutes:     #F4B96A;   /* amber       */\n  --forearms:   #98D4E8;   /* sky         */\n\n  /* ── Status / semantic ─────────────────────────────────────────── */\n  --green:    #4ade80;   /* success, active            */\n  --yellow:   #FFD54F;   /* warnings, recovery         */\n  --red:      #f87171;   /* errors, destructive        */\n  --pr-gold:  #FAC775;   /* personal-record badge      */\n  --purple:   #a78bfa;   /* AI coach, weekly summary   */\n\n  /* ── Special UI ────────────────────────────────────────────────── */\n  --heart-rate:        #19CCF0;   /* live HR display        */\n  --ai-gradient-from:  #7c3aed;   /* AI Coach icon — purple */\n  --ai-gradient-to:    #2563eb;   /* AI Coach icon — blue   */\n  --ai-gradient: linear-gradient(135deg, #7c3aed, #2563eb); /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ════════════════════════════════════════════════════════════════════\n   ATHLIX — TYPOGRAPHY\n   Inter for everything UI. VictoryStriker for hero numerals.\n   Bebas Neue for the marketing wordmark. Tight, uppercase micro-labels.\n   ════════════════════════════════════════════════════════════════════ */\n\n:root {\n  /* ── Families ──────────────────────────────────────────────────── */\n  --font-sans:    'Inter', ui-sans-serif, system-ui, sans-serif;\n  --font-dm:      'DM Sans', 'Inter', ui-sans-serif, system-ui, sans-serif;\n  --font-victory: 'VictoryStriker', ui-sans-serif, system-ui, sans-serif;\n  --font-display: 'Bebas Neue', 'Arial Black', sans-serif;\n\n  /* ── Type scale (px) — mobile-first product UI runs small & dense ── */\n  --text-9:   9px;    /* micro eyebrow / tags            */\n  --text-10:  10px;   /* tab labels, badges             */\n  --text-11:  11px;   /* meta, captions                 */\n  --text-12:  12px;   /* secondary body                 */\n  --text-13:  13px;   /* controls, list rows            */\n  --text-14:  14px;   /* body / nav                     */\n  --text-15:  15px;   /* base body                      */\n  --text-18:  18px;   /* card titles                    */\n  --text-22:  22px;   /* section heads, logo (sidebar)  */\n  --text-24:  24px;   /* page titles                    */\n  --text-34:  34px;   /* hero numerals (VictoryStriker) */\n  --text-52:  52px;   /* wordmark (mobile)              */\n  --text-72:  72px;   /* wordmark (desktop)             */\n\n  /* ── Weights ───────────────────────────────────────────────────── */\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n  --fw-black:    800; /* @kind font */\n\n  /* ── Tracking ──────────────────────────────────────────────────── */\n  --tracking-tight:  -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.08em;\n  --tracking-label:  0.16em;   /* uppercase micro-labels  */\n  --tracking-logo:   0.10em;   /* ATHLIX wordmark         */\n\n  /* ── Line heights ──────────────────────────────────────────────── */\n  --leading-none:  1;\n  --leading-tight: 1.2;\n  --leading-body:  1.6;\n}\n<\u002Fstyle>\n  <style>/* ════════════════════════════════════════════════════════════════════\n   ATHLIX — RADIUS & SPACING\n   Responsive radii via clamp() (smaller on phones, capped on desktop).\n   iOS-inspired control geometry.\n   ════════════════════════════════════════════════════════════════════ */\n\n:root {\n  /* ── Radius — responsive, clamp(mobile-min, vw-scale, desktop-max) ── */\n  --radius-xs:   clamp(4px,  0.8vw, 6px);    /* badges, dots          */\n  --radius-sm:   clamp(6px,  1.2vw, 9px);    /* tags, chips           */\n  --radius-md:   clamp(9px,  1.8vw, 12px);   /* buttons, inputs       */\n  --radius-lg:   clamp(12px, 2.2vw, 16px);   /* cards                 */\n  --radius-xl:   clamp(14px, 2.8vw, 18px);   /* prominent cards       */\n  --radius-2xl:  clamp(16px, 3.2vw, 20px);   /* modals                */\n  --radius-3xl:  clamp(18px, 3.8vw, 24px);   /* bottom sheets         */\n  --radius-4xl:  clamp(20px, 4.5vw, 28px);   /* large bottom sheets   */\n  --radius-pill: 9999px;\n\n  /* ── Spacing scale (px) ────────────────────────────────────────── */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n\n  /* ── Control physics ───────────────────────────────────────────── */\n  --control-height: 48px;        /* inputs, primary buttons          */\n  --press-scale:    0.97; /* @kind other */ /* active/tap shrink */\n  --tap-min:        44px;        /* min touch target                 */\n\n  /* ── Layout ────────────────────────────────────────────────────── */\n  --app-max-width:  480px;       /* mobile content column            */\n  --sidebar-width:  240px;       /* desktop nav rail                 */\n  --tabbar-height:  64px;        /* mobile bottom nav                */\n}\n<\u002Fstyle>\n  <style>/* ════════════════════════════════════════════════════════════════════\n   ATHLIX — EFFECTS: shadows, glows, transitions, keyframes\n   Lime glow is the signature. Soft dark shadows. Quick iOS easing.\n   ════════════════════════════════════════════════════════════════════ */\n\n:root {\n  /* ── Shadows ───────────────────────────────────────────────────── */\n  --shadow-surface: 0 8px 24px rgba(3, 8, 18, 0.30);   /* cards, sheets   */\n  --shadow-lg:      0 12px 30px rgba(0, 0, 0, 0.40);   /* modals, popups  */\n  --shadow-inset:   inset 0 1px 0 rgba(255, 255, 255, 0.04);\n\n  /* ── Lime glows — the brand signature ──────────────────────────── */\n  --glow-accent:    0 0 10px var(--accent-glow);       /* rings, bars     */\n  --glow-fab:       0 4px 20px var(--accent-glow);     /* floating button */\n  --glow-text:      0 0 12px rgba(200, 255, 0, 0.5);   /* lime text       */\n  --glow-segment:   0 8px 16px rgba(200, 255, 0, 0.2); /* active segment  */\n\n  /* ── Blur / glass ──────────────────────────────────────────────── */\n  --blur-nav:   blur(24px); /* @kind other */ /* bottom nav / floating bars */\n  --blur-head:  blur(20px); /* @kind other */ /* sticky headers */\n\n  /* ── Transitions ───────────────────────────────────────────────── */\n  --ease-ios:    cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --t-fast:      0.12s var(--ease-ios);\n  --t-base:      0.18s var(--ease-ios);\n  --t-slow:      0.25s var(--ease-ios);\n}\n\n/* ── Keyframes (lifted from src/index.css) ─────────────────────────── */\n@keyframes cardEnter   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }\n@keyframes fadeIn      { from { opacity: 0; } to { opacity: 1; } }\n@keyframes slideUp     { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }\n@keyframes shimmer     { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }\n@keyframes pulseRing   { 0% { box-shadow: 0 0 0 0 rgba(200,255,0,0.60); } 70% { box-shadow: 0 0 0 10px rgba(200,255,0,0); } 100% { box-shadow: 0 0 0 0 rgba(200,255,0,0); } }\n@keyframes accentPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }\n\n/* ── Animation utility classes ─────────────────────────────────────── */\n.ax-card-enter { animation: cardEnter 0.4s var(--ease-ios) forwards; }\n.ax-fade-in    { animation: fadeIn 0.3s var(--ease-ios) forwards; }\n.ax-slide-up   { animation: slideUp 0.4s var(--ease-ios) forwards; }\n.ax-pulse-ring { animation: pulseRing 2s infinite; }\n\n/* Skeleton shimmer loader */\n.ax-skeleton {\n  background: linear-gradient(90deg, var(--bg-surface) 25%, var(--bg-elevated) 50%, var(--bg-surface) 75%);\n  background-size: 200% 100%;\n  animation: shimmer 1.6s ease-in-out infinite;\n  border-radius: var(--radius-lg);\n}\n<\u002Fstyle>\n  <style>/* ════════════════════════════════════════════════════════════════════\n   ATHLIX — BASE RESET\n   Dark canvas, Inter body, iOS press physics, lime focus ring,\n   thin scrollbars. Mirrors the app's @layer base.\n   ════════════════════════════════════════════════════════════════════ */\n\n* { box-sizing: border-box; }\n\nhtml, body {\n  margin: 0;\n  min-height: 100%;\n  background: var(--bg-base);\n  color: var(--text-primary);\n  font-family: var(--font-sans);\n  font-size: var(--text-15);\n  line-height: var(--leading-body);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n  font-feature-settings: \"kern\" 1, \"liga\" 1, \"calt\" 1;\n}\n\n/* Tap targets: quick shrink on press (iOS feel) */\n:where(button, [type='button'], [type='submit'], [type='reset']) {\n  border-radius: var(--radius-md);\n  transition: transform var(--t-fast), opacity var(--t-fast), box-shadow var(--t-base);\n}\n:where(button:not(:disabled), [type='button']:not(:disabled),\n       [type='submit']:not(:disabled), [type='reset']:not(:disabled)):active {\n  transform: scale(var(--press-scale));\n}\n\n/* Default control geometry */\n:where(input:not([type='checkbox']):not([type='radio']), select, textarea) {\n  min-height: var(--control-height);\n  border-radius: var(--radius-md);\n  box-shadow: var(--shadow-inset);\n}\n\n/* Lime focus ring */\n:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n}\n\n/* Accent selection on form controls */\ninput[type='checkbox'], input[type='radio'] { accent-color: var(--accent); }\n\n/* Thin scrollbars */\n::-webkit-scrollbar       { width: 4px; height: 4px; }\n::-webkit-scrollbar-track { background: transparent; }\n::-webkit-scrollbar-thumb { background: #333; border-radius: 99px; }\n* { scrollbar-width: thin; scrollbar-color: #333 transparent; }\n\n/* Utilities */\n.font-victory { font-family: var(--font-victory); }\n.tabular { font-variant-numeric: tabular-nums; }\n.no-scrollbar::-webkit-scrollbar { display: none; }\n.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }\n<\u002Fstyle>\n  <style>/* ════════════════════════════════════════════════════════════════════\n   ATHLIX DESIGN SYSTEM — global entry point.\n   Consumers link THIS one file. Import order matters:\n   fonts → tokens → base reset.\n   ════════════════════════════════════════════════════════════════════ */\n\n/* ─── Athlix webfonts ───────────────────────────────────────────────\n   Body / UI:  Inter           (Google Fonts)\n   Marketing:  Bebas Neue       (Google Fonts — login wordmark)\n   Display:    VictoryStriker   (local OTF — big stat numerals)\n─────────────────────────────────────────────────────────────────── */\n\n/* latin-ext */\n@font-face {\n  font-family: 'Bebas Neue';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2cc70c07-9e22-44f5-9f53-9c5ae2dba70b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n rl(\"a7f5730a-3ead-4609-b105-1e79dc8eb528\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"f6feab70-61c1-4c27-96db-95805efdd403\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"34cafd41-61a6-49e8-875d-8b45bbb67316\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"c90c016c-30f4-45d1-8f72-e3773224218b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"ccdecc37-7863-4712-9b27-cf692e7074f5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n@font-face {\n  font-family: 'VictoryStriker';\n  src: url(\"c8d7f5f8-0660-4e20-9d5c-f25be9467188\") format('opentype');\n  font-weight: normal;\n  font-style: normal;\n  font-display: block;\n}\n\n/* ════════════════════════════════════════════════════════════════════\n   ATHLIX — COLOUR SYSTEM\n   Source of truth: src/theme/colors.ts (applied at runtime in the app).\n   Lime-on-blue-black. Dark scheme only.\n   ════════════════════════════════════════════════════════════════════ */\n\n:root {\n  color-scheme: dark;\n\n  /* ── Backgrounds — darkest (root) → lightest (raised) ──────────── */\n  --bg-base:        #0a0c10;   /* app / page background          */\n  --bg-surface:     #121720;   /* cards, sheets, panels          */\n  --bg-elevated:    #1a2030;   /* inputs, inner cards, rows      */\n  --bg-hover:       #1e2638;   /* hover / tapped state           */\n\n  /* ── Borders ───────────────────────────────────────────────────── */\n  --border:         #1e2638;   /* default 1px border             */\n  --border-subtle:  #121720;   /* hairline dividers inside cards */\n\n  /* ── Text ──────────────────────────────────────────────────────── */\n  --text-primary:   #e8edf3;   /* headings, numbers              */\n  --text-secondary: #8692a4;   /* subheads, meta labels          */\n  --text-muted:     #3a4a60;   /* placeholders, disabled, quiet  */\n\n  /* ── Accent — lime. Change one value to re-brand. ──────────────── */\n  --accent:         #C8FF00;\n  --accent-hover:   #b0e000;\n  --accent-dim:     rgba(200, 255, 0, 0.12);   /* tinted fills behind accent */\n  --accent-glow:    rgba(200, 255, 0, 0.30);   /* FAB / ring glow            */\n  --on-accent:      #000000;                   /* text on lime               */\n\n  /* ── Metric rings (Home & Progress hero) ───────────────────────── */\n  --ring-volume:    #4FC3F7;   /* blue   */\n  --ring-recovery:  #FFD54F;   /* yellow */\n  --ring-strain:    #C8FF00;   /* lime   */\n\n  /* ── Muscle groups — workout cards, calendar bars, muscle map ──── */\n  --chest:      #F09595;   /* pink-red    */\n  --back:       #5DCAA5;   /* sage green  */\n  --legs:       #EF9F27;   /* orange      */\n  --shoulders:  #AFA9EC;   /* lavender    */\n  --core:       #ff7a59;   /* coral       */\n  --biceps:     #85B7EB;   /* steel blue  */\n  --triceps:    #AFA9EC;   /* lavender    */\n  --cardio:     #ff7a59;   /* coral       */\n  --glutes:     #F4B96A;   /* amber       */\n  --forearms:   #98D4E8;   /* sky         */\n\n  /* ── Status / semantic ─────────────────────────────────────────── */\n  --green:    #4ade80;   /* success, active            */\n  --yellow:   #FFD54F;   /* warnings, recovery         */\n  --red:      #f87171;   /* errors, destructive        */\n  --pr-gold:  #FAC775;   /* personal-record badge      */\n  --purple:   #a78bfa;   /* AI coach, weekly summary   */\n\n  /* ── Special UI ────────────────────────────────────────────────── */\n  --heart-rate:        #19CCF0;   /* live HR display        */\n  --ai-gradient-from:  #7c3aed;   /* AI Coach icon — purple */\n  --ai-gradient-to:    #2563eb;   /* AI Coach icon — blue   */\n  --ai-gradient: linear-gradient(135deg, #7c3aed, #2563eb); /* @kind other */\n}\n\n/* ════════════════════════════════════════════════════════════════════\n   ATHLIX — TYPOGRAPHY\n   Inter for everything UI. VictoryStriker for hero numerals.\n   Bebas Neue for the marketing wordmark. Tight, uppercase micro-labels.\n   ════════════════════════════════════════════════════════════════════ */\n\n:root {\n  /* ── Families ──────────────────────────────────────────────────── */\n  --font-sans:    'Inter', ui-sans-serif, system-ui, sans-serif;\n  --font-dm:      'DM Sans', 'Inter', ui-sans-serif, system-ui, sans-serif;\n  --font-victory: 'VictoryStriker', ui-sans-serif, system-ui, sans-serif;\n  --font-display: 'Bebas Neue', 'Arial Black', sans-serif;\n\n  /* ── Type scale (px) — mobile-first product UI runs small & dense ── */\n  --text-9:   9px;    /* micro eyebrow / tags            */\n  --text-10:  10px;   /* tab labels, badges             */\n  --text-11:  11px;   /* meta, captions                 */\n  --text-12:  12px;   /* secondary body                 */\n  --text-13:  13px;   /* controls, list rows            */\n  --text-14:  14px;   /* body / nav                     */\n  --text-15:  15px;   /* base body                      */\n  --text-18:  18px;   /* card titles                    */\n  --text-22:  22px;   /* section heads, logo (sidebar)  */\n  --text-24:  24px;   /* page titles                    */\n  --text-34:  34px;   /* hero numerals (VictoryStriker) */\n  --text-52:  52px;   /* wordmark (mobile)              */\n  --text-72:  72px;   /* wordmark (desktop)             */\n\n  /* ── Weights ───────────────────────────────────────────────────── */\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n  --fw-black:    800; /* @kind font */\n\n  /* ── Tracking ──────────────────────────────────────────────────── */\n  --tracking-tight:  -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.08em;\n  --tracking-label:  0.16em;   /* uppercase micro-labels  */\n  --tracking-logo:   0.10em;   /* ATHLIX wordmark         */\n\n  /* ── Line heights ──────────────────────────────────────────────── */\n  --leading-none:  1;\n  --leading-tight: 1.2;\n  --leading-body:  1.6;\n}\n\n/* ════════════════════════════════════════════════════════════════════\n   ATHLIX — RADIUS & SPACING\n   Responsive radii via clamp() (smaller on phones, capped on desktop).\n   iOS-inspired control geometry.\n   ════════════════════════════════════════════════════════════════════ */\n\n:root {\n  /* ── Radius — responsive, clamp(mobile-min, vw-scale, desktop-max) ── */\n  --radius-xs:   clamp(4px,  0.8vw, 6px);    /* badges, dots          */\n  --radius-sm:   clamp(6px,  1.2vw, 9px);    /* tags, chips           */\n  --radius-md:   clamp(9px,  1.8vw, 12px);   /* buttons, inputs       */\n  --radius-lg:   clamp(12px, 2.2vw, 16px);   /* cards                 */\n  --radius-xl:   clamp(14px, 2.8vw, 18px);   /* prominent cards       */\n  --radius-2xl:  clamp(16px, 3.2vw, 20px);   /* modals                */\n  --radius-3xl:  clamp(18px, 3.8vw, 24px);   /* bottom sheets         */\n  --radius-4xl:  clamp(20px, 4.5vw, 28px);   /* large bottom sheets   */\n  --radius-pill: 9999px;\n\n  /* ── Spacing scale (px) ────────────────────────────────────────── */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n\n  /* ── Control physics ───────────────────────────────────────────── */\n  --control-height: 48px;        /* inputs, primary buttons          */\n  --press-scale:    0.97; /* @kind other */ /* active/tap shrink */\n  --tap-min:        44px;        /* min touch target                 */\n\n  /* ── Layout ────────────────────────────────────────────────────── */\n  --app-max-width:  480px;       /* mobile content column            */\n  --sidebar-width:  240px;       /* desktop nav rail                 */\n  --tabbar-height:  64px;        /* mobile bottom nav                */\n}\n\n/* ════════════════════════════════════════════════════════════════════\n   ATHLIX — EFFECTS: shadows, glows, transitions, keyframes\n   Lime glow is the signature. Soft dark shadows. Quick iOS easing.\n   ════════════════════════════════════════════════════════════════════ */\n\n:root {\n  /* ── Shadows ───────────────────────────────────────────────────── */\n  --shadow-surface: 0 8px 24px rgba(3, 8, 18, 0.30);   /* cards, sheets   */\n  --shadow-lg:      0 12px 30px rgba(0, 0, 0, 0.40);   /* modals, popups  */\n  --shadow-inset:   inset 0 1px 0 rgba(255, 255, 255, 0.04);\n\n  /* ── Lime glows — the brand signature ──────────────────────────── */\n  --glow-accent:    0 0 10px var(--accent-glow);       /* rings, bars     */\n  --glow-fab:       0 4px 20px var(--accent-glow);     /* floating button */\n  --glow-text:      0 0 12px rgba(200, 255, 0, 0.5);   /* lime text       */\n  --glow-segment:   0 8px 16px rgba(200, 255, 0, 0.2); /* active segment  */\n\n  /* ── Blur / glass ──────────────────────────────────────────────── */\n  --blur-nav:   blur(24px); /* @kind other */ /* bottom nav / floating bars */\n  --blur-head:  blur(20px); /* @kind other */ /* sticky headers */\n\n  /* ── Transitions ───────────────────────────────────────────────── */\n  --ease-ios:    cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --t-fast:      0.12s var(--ease-ios);\n  --t-base:      0.18s var(--ease-ios);\n  --t-slow:      0.25s var(--ease-ios);\n}\n\n/* ── Keyframes (lifted from src/index.css) ─────────────────────────── */\n@keyframes cardEnter   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }\n@keyframes fadeIn      { from { opacity: 0; } to { opacity: 1; } }\n@keyframes slideUp     { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }\n@keyframes shimmer     { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }\n@keyframes pulseRing   { 0% { box-shadow: 0 0 0 0 rgba(200,255,0,0.60); } 70% { box-shadow: 0 0 0 10px rgba(200,255,0,0); } 100% { box-shadow: 0 0 0 0 rgba(200,255,0,0); } }\n@keyframes accentPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }\n\n/* ── Animation utility classes ─────────────────────────────────────── */\n.ax-card-enter { animation: cardEnter 0.4s var(--ease-ios) forwards; }\n.ax-fade-in    { animation: fadeIn 0.3s var(--ease-ios) forwards; }\n.ax-slide-up   { animation: slideUp 0.4s var(--ease-ios) forwards; }\n.ax-pulse-ring { animation: pulseRing 2s infinite; }\n\n/* Skeleton shimmer loader */\n.ax-skeleton {\n  background: linear-gradient(90deg, var(--bg-surface) 25%, var(--bg-elevated) 50%, var(--bg-surface) 75%);\n  background-size: 200% 100%;\n  animation: shimmer 1.6s ease-in-out infinite;\n  border-radius: var(--radius-lg);\n}\n\n/* ════════════════════════════════════════════════════════════════════\n   ATHLIX — BASE RESET\n   Dark canvas, Inter body, iOS press physics, lime focus ring,\n   thin scrollbars. Mirrors the app's @layer base.\n   ════════════════════════════════════════════════════════════════════ */\n\n* { box-sizing: border-box; }\n\nhtml, body {\n  margin: 0;\n  min-height: 100%;\n  background: var(--bg-base);\n  color: var(--text-primary);\n  font-family: var(--font-sans);\n  font-size: var(--text-15);\n  line-height: var(--leading-body);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n  font-feature-settings: \"kern\" 1, \"liga\" 1, \"calt\" 1;\n}\n\n/* Tap targets: quick shrink on press (iOS feel) */\n:where(button, [type='button'], [type='submit'], [type='reset']) {\n  border-radius: var(--radius-md);\n  transition: transform var(--t-fast), opacity var(--t-fast), box-shadow var(--t-base);\n}\n:where(button:not(:disabled), [type='button']:not(:disabled),\n       [type='submit']:not(:disabled), [type='reset']:not(:disabled)):active {\n  transform: scale(var(--press-scale));\n}\n\n/* Default control geometry */\n:where(input:not([type='checkbox']):not([type='radio']), select, textarea) {\n  min-height: var(--control-height);\n  border-radius: var(--radius-md);\n  box-shadow: var(--shadow-inset);\n}\n\n/* Lime focus ring */\n:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n}\n\n/* Accent selection on form controls */\ninput[type='checkbox'], input[type='radio'] { accent-color: var(--accent); }\n\n/* Thin scrollbars */\n::-webkit-scrollbar       { width: 4px; height: 4px; }\n::-webkit-scrollbar-track { background: transparent; }\n::-webkit-scrollbar-thumb { background: #333; border-radius: 99px; }\n* { scrollbar-width: thin; scrollbar-color: #333 transparent; }\n\n/* Utilities */\n.font-victory { font-family: var(--font-victory); }\n.tabular { font-variant-numeric: tabular-nums; }\n.no-scrollbar::-webkit-scrollbar { display: none; }\n.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }\n\n<\u002Fstyle>\n  <script src=\"89ea7619-9df7-48f6-89dc-94cf691527a7\"><\u002Fscript>\n  <script src=\"73113eee-d073-4c67-b01b-a20bd3bb4b52\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"width:390px;min-height:844px;background:var(--bg-base);position:relative;overflow:hidden;font-family:var(--font-sans)\">\n\n  <div style=\"position:relative;z-index:1;display:flex;flex-direction:column;min-height:844px;box-sizing:border-box;padding:20px 24px 28px\">\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between\">\n      <button sc-camel-on-click=\"{{ onBack }}\" style=\"width:40px;height:40px;border-radius:50%;background:var(--bg-elevated);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer\" style-hover=\"background:var(--bg-hover)\">\n        <i data-lucide=\"chevron-left\" style=\"width:20px;height:20px;color:var(--text-primary);stroke-width:2.5px\"><\u002Fi>\n      <\u002Fbutton>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px\">\n        <span style=\"font-family:var(--font-display);font-size:20px;letter-spacing:0.04em;color:var(--accent)\">{{ dateLabel }}<\u002Fspan>\n        <span style=\"font-size:var(--text-13);font-weight:var(--fw-medium);color:var(--text-secondary)\">{{ timeLabel }} · {{ activityType }}<\u002Fspan>\n      <\u002Fdiv>\n      <button style=\"width:40px;height:40px;border-radius:50%;background:var(--bg-elevated);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer\" style-hover=\"background:var(--bg-hover)\">\n        <i data-lucide=\"share-2\" style=\"width:17px;height:17px;color:var(--text-primary);stroke-width:2px\"><\u002Fi>\n      <\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 0 8px;gap:14px\">\n      <div style=\"width:52px;height:52px;display:flex;align-items:center;justify-content:center\">\n        \n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 8px; padding-top: 7px; padding-left: 13px; padding-right: 13px; margin-left: 4px; margin-right: -36px\">\n        <span style=\"font-family:var(--font-victory);font-size:108px;line-height:1.05;color:var(--text-primary);font-variant-numeric:tabular-nums\">{{ distanceKm }}<\u002Fspan><span style=\"font-family: var(--font-sans); font-size: 22px; font-weight: var(--fw-bold); letter-spacing: var(--tracking-label); color: var(--accent); width: 41px; height: 38px; margin-top: 0px; margin-bottom: -91px\">KM<\u002Fspan>\n        \n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:28px\">\n\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 16px\">\n        <span style=\"font-size:11px;font-weight:var(--fw-bold);letter-spacing:var(--tracking-label);color:var(--text-secondary)\">PACE<\u002Fspan><span style=\"display: flex; align-items: center; gap: 6px; line-height: 1.15; margin-left: 32px; margin-right: 0px; margin-top: 0px; margin-bottom: 0px\">\n          <span style=\"font-family: var(--font-victory); font-size: 46px; color: var(--accent); font-variant-numeric: tabular-nums; margin-right: -28px\">{{ pace }}<\u002Fspan>\n          <span style=\"font-size: 15px; color: var(--text-secondary); font-weight: var(--fw-medium); margin-top: 25px; margin-left: 28px\">/km<\u002Fspan>\n        <\u002Fspan>\n        \n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n        <span style=\"font-size:11px;font-weight:var(--fw-bold);letter-spacing:var(--tracking-label);color:var(--text-secondary)\">TIME<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:6px;line-height:1.15;padding-top:4px\">\n          <span style=\"font-family:var(--font-victory);font-size:40px;color:var(--text-primary);font-variant-numeric:tabular-nums\">{{ time }}<\u002Fspan>\n          \n        <\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n        <span style=\"font-size:11px;font-weight:var(--fw-bold);letter-spacing:var(--tracking-label);color:var(--text-secondary)\">CALORIES<\u002Fspan>\n        <span style=\"display: flex; align-items: center; gap: 6px; line-height: 1.15; padding-top: 4px; text-align: center; flex-direction: column\">\n          \n          <span style=\"font-family:var(--font-victory);font-size:40px;color:var(--text-primary);font-variant-numeric:tabular-nums\">{{ calories }}<\u002Fspan><span style=\"font-size:15px;color:var(--text-secondary);font-weight:var(--fw-medium)\">kcal<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n\n      \n\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n        <span style=\"font-size:11px;font-weight:var(--fw-bold);letter-spacing:var(--tracking-label);color:var(--text-secondary)\">SPLITS<br><\u002Fspan>\n        <sc-for list=\"{{ splitsList }}\" as=\"split\" hint-placeholder-count=\"2\">\n          <div style=\"display: flex; flex-direction: column; align-items: center; padding-right: 36px\">\n            <div style=\"display:flex;align-items:center;justify-content:center;gap:8px\">\n              <span style=\"font-size:14px;color:var(--text-secondary);font-weight:var(--fw-medium)\">{{ split.index }}<\u002Fspan>\n              <span style=\"color:var(--text-muted)\">—<\u002Fspan>\n              <span style=\"font-family:var(--font-victory);font-size:26px;color:var(--text-primary);line-height:1;font-variant-numeric:tabular-nums\">{{ split.time }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ split.hasConnector }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:1px;height:16px;background:var(--border);opacity:0.6\"><\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <div style=\"text-align:center;padding-top:24px\">\n      <span style=\"font-size:11px;color:var(--text-muted)\">© {{ year }} Athlix · Map © OpenStreetMap &amp; CARTO<\u002Fspan>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;dateLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;MON, JUL 27&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;timeLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;6:55 PM&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;activityType&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Outdoor&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;distanceKm&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1.82&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pace&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5:03&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9:11&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;calories&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;118&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;effort&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:3,&quot;min&quot;:0,&quot;max&quot;:5,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;onBack&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    if (window.lucide) window.lucide.createIcons();\n  }\n  componentDidUpdate() {\n    if (window.lucide) window.lucide.createIcons();\n  }\n  renderVals() {\n    const effort = this.props.effort ?? 3;\n    const heights = [10, 14, 18, 22, 26];\n    return {\n      dateLabel: this.props.dateLabel ?? 'MON, JUL 27',\n      timeLabel: this.props.timeLabel ?? '6:55 PM',\n      activityType: this.props.activityType ?? 'Outdoor',\n      distanceKm: this.props.distanceKm ?? '1.82',\n      pace: this.props.pace ?? '5:03',\n      time: this.props.time ?? '9:11',\n      calories: this.props.calories ?? '118',\n      effort: effort,\n      effortBars: heights.map((h, i) => ({ h, color: i < effort ? 'var(--accent)' : 'var(--bg-hover)' })),\n      splitsList: (this.props.splits ?? [{ index: 1, time: '4:22' }, { index: 2, time: '5:03' }]).map((s, i, arr) => ({ ...s, hasConnector: i < arr.length - 1 })),\n      year: new Date().getFullYear(),\n      onBack: () => { if (this.props.onBack) this.props.onBack(); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
