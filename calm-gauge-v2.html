<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calm Gauge</title>
<style>
  :root{
    --green:#3ddc84;
    --yellow:#f4d35e;
    --orange:#ef7d2f;
    --text-dim:#93a8a3;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#040909;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }

  /* ---------- staging area: hints of the dashboard behind the card ---------- */
  .stage{
    position:relative;
    width:820px;
    height:560px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ghost-card{
    position:absolute;
    top:6px;
    right:0px;
    width:220px;
    height:140px;
    border-radius:24px;
    background:linear-gradient(160deg,#101d1f,#070f10);
    opacity:.55;
    transform:rotate(1.2deg);
  }
  .ghost-line{
    position:absolute;
    top:26px;
    right:40px;
    width:130px;
    height:80px;
    border:2px solid rgba(255,255,255,.10);
    border-bottom:none;
    border-left:none;
    border-top-right-radius:60px;
    opacity:.6;
  }
  .ghost-ms{
    position:absolute;
    bottom:14px;
    right:14px;
    font-size:34px;
    font-weight:700;
    color:rgba(255,255,255,.09);
    letter-spacing:-1px;
  }

  /* ---------------------------- the card itself ---------------------------- */
  .card{
    position:relative;
    z-index:2;
    width:720px;
    padding:46px 44px 30px;
    border-radius:34px;
    background:
      radial-gradient(120% 100% at 50% -6%, #16302e 0%, #0e2422 34%, #081615 62%, #050d0d 100%),
      radial-gradient(140% 90% at 50% 118%, #0c211f 0%, rgba(12,33,31,0) 60%);
    background-blend-mode:screen;
    box-shadow:
      0 40px 80px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,255,255,.05),
      inset 0 0 90px rgba(0,0,0,.55);
    overflow:hidden;
    text-align:center;
    user-select:none;
  }

  .glow-blob{
    position:absolute;
    top:-40px;
    left:50%;
    width:420px;
    height:280px;
    transform:translateX(-50%);
    border-radius:50%;
    filter:blur(60px);
    opacity:.35;
    transition:background .8s ease;
    pointer-events:none;
  }

  .gauge-wrap{
    position:relative;
    width:100%;
    max-width:560px;
    margin:0 auto;
  }
  svg{ width:100%; height:auto; display:block; overflow:visible; }

  .tick{
    stroke:#3f5b57;
    stroke-width:4;
    stroke-linecap:round;
  }
  .tick-end{
    stroke:#4c6863;
  }

  .dial-face{
    fill:url(#dialGradient);
  }
  .dial-rim{
    fill:none;
    stroke:rgba(255,255,255,.08);
    stroke-width:1.5;
  }
  .dial-rim-glow{
    fill:none;
    stroke:rgba(200,225,220,.22);
    stroke-width:2;
    filter:blur(2px);
  }

  .needle{
    transform-origin:200px 200px;
    filter:drop-shadow(0 0 5px rgba(255,255,255,.75)) drop-shadow(0 0 16px rgba(210,230,225,.35));
    transition:transform 1.15s cubic-bezier(.32,1.5,.5,1);
  }

  #arc{
    transition:stroke-dashoffset 1.15s cubic-bezier(.32,1.5,.5,1);
  }

  .readout{
    position:relative;
    margin-top:-24px;
  }
  .readout-bg{
    position:absolute;
    left:50%;
    top:38%;
    width:320px;
    height:210px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(closest-side,
      #0a1917 0%,
      #0a1917 68%,
      rgba(10,25,23,0) 100%);
    z-index:0;
    pointer-events:none;
  }
  .value{
    position:relative;
    z-index:1;
    font-size:76px;
    font-weight:700;
    color:#f6f9f8;
    letter-spacing:-2px;
    line-height:1;
    text-shadow:0 0 26px rgba(255,255,255,.18);
  }
  .label{
    position:relative;
    z-index:1;
    margin-top:10px;
    font-size:22px;
    font-weight:600;
    transition:color .5s ease;
  }
  .timestamp{
    position:relative;
    z-index:1;
    margin-top:10px;
    font-size:15px;
    color:var(--text-dim);
    font-weight:400;
  }
  .scale-ends{
    display:flex;
    justify-content:space-between;
    max-width:560px;
    margin:14px auto 0;
    padding:0 4px;
    font-size:16px;
    color:var(--text-dim);
  }

  .controls{
    margin-top:30px;
    display:flex;
    align-items:center;
    gap:14px;
    justify-content:center;
    opacity:.75;
  }
  .controls input[type=range]{
    width:220px;
    accent-color:#f3c94d;
  }
  .controls span{
    color:var(--text-dim);
    font-size:12px;
    width:28px;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="ghost-card"></div>
  <div class="ghost-line"></div>
  <div class="ghost-ms">60 ms</div>

  <div class="card">
    <div class="glow-blob" id="glowBlob"></div>

    <div class="gauge-wrap">
      <svg viewBox="0 0 400 210">
        <defs>
          <linearGradient id="arcGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#3ddc84"/>
            <stop offset="42%"  stop-color="#dfd25a"/>
            <stop offset="70%"  stop-color="#f0ac44"/>
            <stop offset="100%" stop-color="#ee7b30"/>
          </linearGradient>
          <radialGradient id="dialGradient" cx="50%" cy="30%" r="85%">
            <stop offset="0%"  stop-color="#0e1f1c"/>
            <stop offset="45%" stop-color="#081412"/>
            <stop offset="75%" stop-color="#050e0c"/>
            <stop offset="100%" stop-color="#030807" stop-opacity=".65"/>
          </radialGradient>
          <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#050d0d" stop-opacity="0"/>
            <stop offset="52%"  stop-color="#050d0d" stop-opacity="0"/>
            <stop offset="100%" stop-color="#050d0d" stop-opacity="1"/>
          </linearGradient>
          <filter id="arcGlow" x="-40%" y="-60%" width="180%" height="220%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- recessed dial face: full circle, no straight seam -->
        <circle class="dial-face" cx="200" cy="200" r="150"/>
        <circle cx="200" cy="200" r="150" fill="url(#bottomFade)"/>
        <path class="dial-rim-glow" d="M 110 96 A 152 152 0 0 1 290 96"/>

        <!-- track background -->
        <path d="M 30 200 A 170 170 0 0 1 370 200" fill="none"
              stroke="#152d2b" stroke-width="19" stroke-linecap="round"/>

        <!-- colored arc: dasharray/dashoffset are set by JS so it fills/empties with value -->
        <path id="arc" d="M 30 200 A 170 170 0 0 1 370 200" fill="none"
              stroke="url(#arcGradient)" stroke-width="19" stroke-linecap="round"
              filter="url(#arcGlow)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>

        <!-- tick marks (0, ~38°, 100 mirrored) -->
        <line class="tick tick-end" x1="35" y1="200" x2="50" y2="200"/>
        <line class="tick" x1="94" y1="74" x2="103" y2="85"/>
        <line class="tick" x1="306" y1="74" x2="297" y2="85"/>
        <line class="tick tick-end" x1="365" y1="200" x2="350" y2="200"/>

        <!-- needle: shortened + simple pivot dot so it clears the number below -->
        <g id="needle" class="needle">
          <path d="M 200 200 L 193 122 Q 200 114 207 122 Z" fill="#f2f6f5"/>
          <circle cx="200" cy="200" r="4.5" fill="#f2f6f5"/>
        </g>
      </svg>
    </div>

    <div class="readout">
      <div class="readout-bg"></div>
      <div class="value" id="valueText">56</div>
      <div class="label" id="labelText">Calm</div>
      <div class="timestamp" id="timeText">18 mins ago</div>
    </div>

    <div class="scale-ends">
      <span>0</span>
      <span>100</span>
    </div>

    <div class="controls">
      <span>0</span>
      <input type="range" id="slider" min="0" max="100" value="56">
      <span>100</span>
    </div>
  </div>
</div>

<script>
  const needle   = document.getElementById('needle');
  const arc      = document.getElementById('arc');
  const valueEl  = document.getElementById('valueText');
  const labelEl  = document.getElementById('labelText');
  const glowBlob = document.getElementById('glowBlob');
  const slider   = document.getElementById('slider');

  function angleForValue(v){
    return -90 + (v / 100) * 180;
  }

  function zoneForValue(v){
    if (v < 35) return { text: 'Calm',     color: '#3ddc84' };
    if (v < 65) return { text: 'Balanced', color: '#f0c94d' };
    if (v < 85) return { text: 'Elevated', color: '#ef8a3a' };
    return        { text: 'Intense',   color: '#ea5a3a' };
  }

  function setGauge(v, animate = true){
    v = Math.max(0, Math.min(100, v));
    const angle = angleForValue(v);
    needle.style.transition = animate ? '' : 'none';
    needle.style.transform = `rotate(${angle}deg)`;

    arc.style.transition = animate ? '' : 'none';
    arc.style.strokeDashoffset = 100 - v;

    valueEl.textContent = Math.round(v);

    const zone = zoneForValue(v);
    labelEl.textContent = zone.text;
    labelEl.style.color = zone.color;
    glowBlob.style.background =
      `radial-gradient(circle, ${zone.color} 0%, transparent 70%)`;
  }

  slider.addEventListener('input', e => setGauge(Number(e.target.value)));

  setGauge(0, false);
  requestAnimationFrame(() => setTimeout(() => setGauge(56), 80));
</script>

</body>
</html>
